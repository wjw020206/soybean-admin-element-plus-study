packages:
  - "packages/*"

# 允许在 workspace 根目录直接执行安装命令
ignoreWorkspaceRootCheck: true

# 自动把 workspace 内部包链接到彼此的依赖图中
linkWorkspacePackages: true

# 将子依赖尽量提升到顶层 node_modules，兼容依赖声明不严格的旧项目
shamefullyHoist: true

# recast 的 TypeScript 解析器会直接加载 @babel/parser，但没有声明该依赖。
# 固定为 Babel 7，避免它误用 vue-router 提升到顶层的 Babel 8 RC
packageExtensions:
  recast@0.23.9:
    dependencies:
      '@babel/parser': 7.29.7

# 允许这些原生依赖执行构建脚本
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

# 不受新版本发布时间限制（默认新版本发布满 1440 分钟（24 小时） 后，才会被选择安装），可以立即安装（白名单）
minimumReleaseAgeExclude:
  - tsx@4.22.4
